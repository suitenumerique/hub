server {
  listen 8080;
  listen 3000;
  server_name localhost;

  server_tokens off;

  root /usr/share/nginx/html;

  add_header X-Frame-Options DENY always;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Alpine's mime.types lacks .mjs: the pdf.js worker must be served as
  # JavaScript or the browser refuses to load it as a module.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location ~ "^/401/?$" {
    try_files $uri /401.html;
  }

  location ~ "^/403/?$" {
    try_files $uri /403.html;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
