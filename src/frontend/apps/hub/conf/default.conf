server {
  listen 8080;
  listen 3000;
  server_name localhost;

  server_tokens off;

  root /app;

  add_header X-Frame-Options DENY always;

  # The emoji drawings and data (scripts/copy-emoji-assets.mjs) shrink 2 to
  # 6 times (HTML is always compressed once gzip is on).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types image/svg+xml application/json;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Their names carry no version: a browser keeps them a week, then checks
  # their ETag. An add_header here drops the server's, hence the repeat.
  location /emoji/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  # Alpine's mime.types lacks .mjs: the pdf.js worker must be served as
  # JavaScript or the browser refuses to load it as a module.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location ~ "^/401/?$" {
    try_files $uri /401.html;
  }

  location ~ "^/403/?$" {
    try_files $uri /403.html;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
