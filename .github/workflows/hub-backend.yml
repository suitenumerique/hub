name: Backend Workflow

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/backend/**"
      - "src/mail/**"
      - ".github/workflows/hub-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-dependencies:
    uses: ./.github/workflows/_dependencies.yml
    with:
      with-build_mails: true


  lint-back:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_python-lint.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      working_directory: src/backend
      uv_sync_args: --locked --dev
      pylint_targets: .


  test-back:
    runs-on: ubuntu-latest
    needs: install-dependencies

    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hub
          POSTGRES_USER: dinum
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_CONFIGURATION: Test
      DJANGO_SETTINGS_MODULE: hub.settings
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForTestPurposeOnly
      OIDC_OP_JWKS_ENDPOINT: /endpoint-for-test-purpose-only
      DB_HOST: localhost
      DB_NAME: hub
      DB_USER: dinum
      DB_PASSWORD: pass
      DB_PORT: 5432
      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_S3_ACCESS_KEY_ID: hub
      AWS_S3_SECRET_ACCESS_KEY: password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create writable /data
        run: |
          sudo mkdir -p /data/rustfs && \
          sudo mkdir -p /data/static

      - name: Build or restore the mail templates
        uses: suitenumerique/ci/actions/mail-templates@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1

      - name: Start RustFS
        run: |
          # /data/rustfs is root-owned on the CI runner.
          docker run -d --name rustfs --user root \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=hub \
            -e RUSTFS_SECRET_KEY=password \
            -e RUSTFS_OBS_LOG_DIRECTORY= \
            -v /data/rustfs:/data \
            rustfs/rustfs:1.0.0

      - name: Wait for RustFS to be ready
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 1 --retry-all-errors \
            --max-time 5 --retry-max-time 120 \
            http://localhost:9000/health/ready || \
            { docker logs rustfs; exit 1; }

      - name: Configure RustFS
        run: |
          docker run --rm --network container:rustfs \
            -e AWS_ACCESS_KEY_ID=hub \
            -e AWS_SECRET_ACCESS_KEY=password \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_ENDPOINT_URL=http://localhost:9000 \
            --entrypoint sh amazon/aws-cli:2.37.4 -ec '
              aws s3api head-bucket --bucket hub-media-storage 2>/dev/null || \
                aws s3api create-bucket --bucket hub-media-storage
              aws s3api put-bucket-versioning --bucket hub-media-storage \
                --versioning-configuration Status=Enabled
            '

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install development dependencies
        run: pip install --user .[dev]

      - name: Install gettext (required to compile messages) and MIME support
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext pandoc shared-mime-info
          sudo wget https://raw.githubusercontent.com/suitenumerique/django-lasuite/refs/heads/main/assets/conf/mime.types -O /etc/mime.types

      - name: Generate a MO file from strings extracted from the project
        run: python manage.py compilemessages

      - name: Run tests
        run: ~/.local/bin/pytest -n 2
