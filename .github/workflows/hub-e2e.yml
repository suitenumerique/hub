name: End-to-end Workflow

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/hub-e2e.yml"
      - ".github/workflows/_dependencies.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-dependencies:
    uses: ./.github/workflows/_dependencies.yml
    with:
      node_version: '22.x'
      with-front-dependencies-installation: true

  build-frontend-e2e:
    runs-on: ubuntu-latest
    needs: install-dependencies
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.5"

      - name: Restore the frontend cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Build frontend (static export, .env.development)
        run: |
          cd src/frontend/apps/hub
          set -a
          . ./.env.development
          set +a
          yarn build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hub-frontend-out
          path: src/frontend/apps/hub/out
          retention-days: 1
          if-no-files-found: error

  test-e2e:
    needs: [install-dependencies, build-frontend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs its part of every project: the chat suites on
        # Chromium and the smoke tests on WebKit and Firefox. The shard count
        # follows the length of this list.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The browsers and their system libraries come from the official
      # Playwright image. Installing those libraries with apt depends on the
      # Ubuntu mirror, which is sometimes slow enough to stall the job for
      # 20+ minutes. The image tag follows the @playwright/test version so
      # upgrades keep both in sync. The pull runs in the background, during
      # the next steps.
      - name: Start pulling the Playwright image
        run: |
          VERSION=$(jq -r '.devDependencies["@playwright/test"]' src/frontend/apps/e2e/package.json)
          IMAGE="mcr.microsoft.com/playwright:v${VERSION}-noble"
          echo "PLAYWRIGHT_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          nohup docker pull --quiet "${IMAGE}" > /tmp/playwright-pull.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.5"

      - name: Restore the frontend cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Set e2e env variables
        run: cat env.d/development/common.e2e >> env.d/development/common.local

      - name: Download frontend bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hub-frontend-out
          path: src/frontend/apps/hub/out

      - name: Start Docker services (e2e backend)
        run: make bootstrap-e2e

      # Every shard can get chat suites, which need the local Synapse + MAS
      # stack.
      - name: Start the local Matrix stack
        run: make run-matrix-e2e

      - name: Serve frontend (nginx static + prod vhost)
        run: |
          docker run -d --rm --name hub-static -p 9800:3000 \
            -v "$PWD/src/frontend/apps/hub/out:/app:ro" \
            -v "$PWD/src/frontend/apps/hub/conf/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx/nginx-unprivileged:1.31.9-alpine3.24

      - name: Wait for backend to be ready
        run: |
          timeout 30 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9801/api/v1.0/config/)" != "200" ]]; do echo "Waiting for backend..." && sleep 1; done' && echo "Backend is ready!"

      - name: Wait for frontend to be ready
        run: |
          timeout 30 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:9800/)" != "200" ]]; do echo "Waiting for frontend..." && sleep 1; done' && echo "Frontend is ready!"

      # Only the browsers run in the container: the tests stay on the runner
      # because they reset the database with make and drive mas-cli with
      # docker exec. With the host network, localhost in the browsers is the
      # runner's localhost. The server comes from the cached node_modules,
      # mounted read only.
      - name: Start the Playwright browser server
        run: |
          docker run --detach --name playwright-server --init \
            --network host --ipc=host --user pwuser \
            -v "${PWD}:${PWD}:ro" -w "${PWD}/src/frontend/apps/e2e" \
            "${PLAYWRIGHT_IMAGE}" \
            yarn playwright run-server --host 127.0.0.1 --port 53333
          timeout 60 sh -c 'until docker logs playwright-server 2>&1 | grep -q "Listening on"; do sleep 1; done' \
            || { docker logs playwright-server; exit 1; }

      # Playwright reads PW_TEST_CONNECT_WS_ENDPOINT and connects to the
      # server instead of launching local browsers.
      - name: Run e2e tests
        env:
          PLAYWRIGHT_LIST_PRINT_STEPS: true
          FORCE_COLOR: true
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:53333/
        run: cd src/frontend/apps/e2e && yarn test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Show the Playwright browser server logs
        if: failure()
        run: docker logs playwright-server

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-shard-${{ matrix.shard }}-report
          path: src/frontend/apps/e2e/report/
          retention-days: 7

