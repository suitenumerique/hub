name: Project quality Workflow

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_project-quality.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      print_check_paths: src/backend
      codespell_ignore_words: "afterAll,statics,adresse,appareil,comparaison,connexion,environnement,exemple,groupe,ist,mot,moteur,projet,reste,sie,symboles,transfert,valide,vie"
#      codespell_ignore_words_file: ".codespell-words"
