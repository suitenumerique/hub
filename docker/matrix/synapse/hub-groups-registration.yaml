id: hub-groups-local
url: http://app-dev:8000/matrix/appservice
as_token: hub-groups-as-token-dev-only
hs_token: hub-groups-hs-token-dev-only
sender_localpart: hub-bot
rate_limited: false
namespaces:
  users:
    # The registed control bot and any API-provisioned bot siblings
    # (@hub-bot-*). Declaring them here (exclusive) lets the Application
    # Service register/provision these users over the C-S register endpoint.
    - exclusive: true
      regex: '^@hub-bot(-.*)?:localhost$'
  aliases:
    - exclusive: true
      regex: '^#_hub_control:localhost$'
  rooms: []
